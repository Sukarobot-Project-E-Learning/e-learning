name: Promote Staging to Production Repo

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Push to production repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          # Add production remote
          git remote add production git@github.com:Sukarobot-Project-E-Learning/sukarobot-elearning-demo.git
          
          # Fetch production's main branch to get its current workflows
          git fetch production main --depth=1
          
          # Create an orphan branch to avoid staging history in production
          git checkout --orphan temp-prod-sync
          git rm -rf .
          
          # Bring in staging snapshot
          git checkout main -- .
          
          # Replace workflows with production's workflows when available
          git rm -rf .github/workflows || true
          if git checkout production/main -- .github/workflows 2>/dev/null; then
            echo "✅ Using production workflows"
          else
            echo "ℹ️ No production workflows, keeping staging workflows"
            git checkout main -- .github/workflows || true
          fi
          
          # Commit a single snapshot and force update production
          git add -A
          git commit -m "Sync staging snapshot to production"
          echo "🚀 Syncing snapshot to production..."
          git push production temp-prod-sync:main --force